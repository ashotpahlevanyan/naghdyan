abstract:
  - en: "The article presents psychoontology as a new scientific approach within management psychology, integrating philosophical, psychological, and applied foundations. Psychoontology explores the interaction between human consciousness and reality, viewing the management process not merely as a mechanical or social system, but as a multilayered psychoontological field. The main focus is placed on the four realities model (R1–R4), which enables the identification and harmonization of strategic concepts (R1), subconscious cultural foundations (R4), team-level imaginative space (R3), and operational processes (R2), forming a holistic management mechanism. The paper introduces a psychoontological toolkit that includes diagnostic tests, dominant mapping, module–modulator–modulation mechanisms, and psychoontological sessions that help reveal, direct, and develop individual and collective potential. As a result, the management system attains a new level of harmony, where internal resistance decreases and strategy and functions become interlinked and self-regulating. Psychoontological thinking transforms the organization into a living psychological system in which every individual acts as a conscious unit, contributing to the organization’s sustainable development and effective progress."
    ru: "В статье психоонтология представлена как новое научное направление в психологии управления, объединяющее философские, психологические и прикладные основы. Психоонтология изучает взаимодействие человеческого сознания и реальности, рассматривая управленческий процесс не только как механическую или социальную систему, но как многослойное психоонтологическое поле. Основное внимание уделяется модели четырёх реальностей (Р1–Р4), которая позволяет выявлять и гармонизировать стратегические замыслы (Р1), бессознательные культурные основы (Р4), командное образное пространство (Р3) и операционные процессы (Р2), формируя целостный управленческий механизм. В статье представлен психоонтологический инструментарий — диагностические тесты, картографирование доминант, механизмы модуль–модулятор–модуляция и психоонтологические сессии, способствующие раскрытию, направлению и развитию человеческого и группового потенциала. В результате система управления приобретает новое качество гармонии, где снижается внутренняя сопротивляемость, а стратегия и функции становятся взаимосвязанными и саморегулирующимися. Психоонтологическое мышление превращает организацию в живую психологическую систему, где каждый человек выступает как сознательная единица, способствующая устойчивому развитию и эффективному прогрессу организации."
    hy: "Հոդվածում հոգեօնտոլոգիան ներկայացվում է որպես կառավարման հոգեբանության մեջ ձևավորված նոր գիտական մոտեցում, որը միավորում է փիլիսոփայական, հոգեբանական և կիրառական հիմքերը։ Հոգեօնտոլոգիան ուսումնասիրում է մարդու գիտակցության և իրականության փոխազդեցությունը՝ կառավարման գործընթացը դիտարկելով ոչ միայն որպես մեխանիկական կամ սոցիալական համակարգ, այլ որպես բազմաշերտ հոգեօնտոլոգիական դաշտ։ Հիմնական ուշադրությունը դարձված է չորս իրականությունների մոդելին (Ռ1–Ռ4), որը հնարավորություն է տալիս բացահայտել և ներդաշնակեցնել ռազմավարական մտահղացումները (Ռ1), ենթագիտակցական մշակութային հիմքերը (Ռ4), թիմային պատկերային դաշտը (Ռ3) և օպերացիոն գործընթացները (Ռ2)՝ ձևավորելով ամբողջական կառավարման մեխանիզմ։ Հոդվածը ներկայացնում է հոգեօնտոլոգիական գործիքակազմ՝ ախտորոշիչ թեստեր, դոմինանտների քարտեզագրում, մոդուլ–մոդուլյատոր–մոդուլյացիա մեխանիզմներ և հոգեօնտոլոգիական սեսիաներ, որոնք նպաստում են մարդկային և թիմային ներուժի բացահայտմանը, ուղղորդմանը և զարգացմանը։ Արդյունքում կառավարման համակարգը ձեռք է բերում նոր որակի ներդաշնակություն, որտեղ նվազում են ներքին դիմադրությունները, իսկ ռազմավարությունն ու գործառույթները դառնում են փոխկապակցված և ինքնակարգավորվող։ Հոգեօնտոլոգիական մտածողությունը վերածում է կազմակերպությունը կենդանի հոգեբանական համակարգի, որտեղ յուրաքանչյուր անհատ հանդես է գալիս որպես գիտակցական միավոր, նպաստելով կազմակերպության կայուն զարգացմանը և արդյունավետ առաջընթացին։"
