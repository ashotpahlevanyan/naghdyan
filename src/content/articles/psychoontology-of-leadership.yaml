    hy: "Աննա Կարապետյան — տնտեսագետ, հոգեբան, ՄՌԿ ղեկավար, «Բիբլոս Բանկ Արմենիա» ՓԲԸ"
abstract:
  - en: "The article presents psychoontology as a scientific approach that complements and deepens leadership psychology, enabling leadership to be understood not only within behavioral or socio-psychological frameworks, but also as an ontological process. From this perspective, the leader is conceptualized as a subject who modulates reality, whose influence is expressed through the formation and transformation of experiential structures, image-based systems, situational contexts, and unconscious layers. Psychoontology does not oppose leadership psychology; rather, it expands it by revealing the deeper foundations of leadership that remain beyond the immediate scope of classical analytical tools."
    ru: "В статье психоонтология представлена как научный подход, дополняющий и углубляющий психологию лидерства, позволяющий рассматривать лидерство не только в поведенческих или социально-психологических рамках, но и как онтологический процесс. В данном ракурсе лидер концептуализируется как субъект, модулирующий реальность, чьё влияние проявляется через формирование и трансформацию структур опыта, образных систем, ситуационных контекстов и бессознательных слоёв. Психоонтология не противопоставляется психологии лидерства, а расширяет её, выявляя глубинные основания лидерства, которые остаются за пределами непосредственного рассмотрения классического аналитического инструментария."
    hy: "Հոդվածում հոգեգոյաբանությունը ներկայացվում է որպես առաջնորդության հոգեբանության շրջանակը լրացնող և խորքային մակարդակում ամբողջականացնող գիտական մոտեցում, որը հնարավորություն է տալիս առաջնորդությունը դիտարկել ոչ միայն վարքային կամ սոցիալ-հոգեբանական հարթություններում, այլ՝ որպես օնտոլոգիական գործընթաց։ Այս դիտանկյունից առաջնորդը հանդես է գալիս որպես իրականություն մոդուլացնող սուբյեկտ, որի ազդեցությունը դրսևորվում է փորձի կառուցվածքների, պատկերային համակարգերի, իրադարձային իրավիճակների և անգիտակցական շերտերի ձևավորման ու փոխակերպման միջոցով։ Հոգեգոյաբանությունը չի հակադրվում առաջնորդության հոգեբանությանը, այլ ընդլայնում է այն՝ բացահայտելով առաջնորդության խորքային հիմքերը, որոնք դուրս են մնում դասական գործիքակազմի անմիջական դիտարկումից։"
  - en: "The theoretical core of the article is the four-level model of reality (R1–R4), which allows leadership formation to be analyzed across different ontological strata from strategic potential possibilities (R1), through internal imaginal and meaning-based structures (R3), to their functional embodiment within organizational reality (R2), culminating in unconscious cultural consolidation (R4). This model makes it possible to examine leadership effectiveness not as a set of isolated factors, but as a system of interaction among multiple realities."
    ru: "Теоретическим ядром статьи является четырёхуровневая модель реальности (R1–R4), позволяющая анализировать формирование лидерства в различных онтологических слоях от стратегических потенциальных возможностей (R1), через внутренние образные и смысловые структуры (R3), к их функциональному воплощению в организационной реальности (R2), завершающемуся бессознательной культурной консолидацией (R4). Данная модель позволяет рассматривать эффективность лидерства не как совокупность изолированных факторов, а как систему взаимодействия множественных реальностей."
    hy: "Հոդվածի տեսական առանցքում է իրականության չորս մակարդակների մոդելը (Ռ1–Ռ4), որը թույլ է տալիս վերլուծել առաջնորդության ձևավորումը տարբեր օնտոլոգիական շերտերում՝ սկսած ռազմավարական պոտենցիալ հնարավորություններից (Ռ1), շարունակելով ներքին պատկերային և իմաստային կառուցվածքներով (Ռ3), դրանց գործառնական մարմնավորմամբ կազմակերպական իրականության մեջ (Ռ2) և ավարտելով անգիտակցական մշակութային ամրապնդմամբ (Ռ4)։ Այս մոդելը հնարավորություն է տալիս դիտարկել առաջնորդության արդյունավետությունը ոչ թե մեկուսացված գործոնների, այլ իրականությունների փոխգործակցության համակարգում։"
  - en: "The proposed toolkit ontological position diagnostics, R1–R4 typology, analysis of fixations, and ontological coaching is designed to deepen and extend the applied methods of leadership psychology. It enables the assessment of the leader’s internal organization, the dynamic balance between different realities, and their influence on decision-making processes and organizational culture. The article substantiates that leadership effectiveness depends not only on the presence of behavioral models, but also on the harmonious interaction of the R1–R4 levels."
    ru: "Предлагаемый инструментарий диагностика онтологической позиции, типология R1–R4, анализ фиксаций и онтологический коучинг предназначен для углубления и расширения прикладных методов психологии лидерства. Он позволяет оценивать внутреннюю организованность лидера, динамический баланс между различными реальностями и их влияние на процессы принятия решений и организационную культуру. В статье обосновывается, что эффективность лидерства обусловлена не только наличием поведенческих моделей, но и гармоничным взаимодействием уровней R1–R4."
    hy: "Առաջարկվող գործիքակազմը՝ օնտոլոգիական դիրքի ախտորոշում, Ռ1–Ռ4 տիպաբանություն, ֆիքսացիաների վերլուծություն և օնտոլոգիական քոուչինգ, նախատեսված է առաջնորդության հոգեբանության կիրառական մեթոդները խորացնելու և լրացնելու համար։ Այն հնարավորություն է տալիս գնահատել առաջնորդի ներքին կազմակերպվածությունը, տարբեր իրականությունների միջև դինամիկ հավասարակշռությունը և դրանց ազդեցությունը որոշումների կայացման ու կազմակերպական մշակույթի վրա։ Հոդվածում հիմնավորվում է, որ առաջնորդության արդյունավետությունը պայմանավորված է ոչ միայն վարքային մոդելների առկայությամբ, այլ նաև Ռ1–Ռ4 մակարդակների ներդաշնակ փոխգործակցությամբ։"
  - en: "When multiple strategic possibilities (R1) are articulated through clear imaginal structures (R3) and embodied within the field of functional application (R2), they become consolidated at the unconscious level (R4), forming stable organizational and cultural dynamics. The psychoontological approach is presented as a multi-layered management model with long-term impact, particularly effective in complex, dynamic, and transformation-oriented organizational environments."
    ru: "Когда множественные стратегические возможности (R1) оформляются в чёткие образные структуры (R3) и находят воплощение в сфере функционального применения (R2), они закрепляются на бессознательном уровне (R4), формируя устойчивую организационную и культурную динамику. Психоонтологический подход представлен как многоуровневая управленческая модель с долгосрочным эффектом, особенно эффективная в сложных, динамичных и ориентированных на трансформацию организационных средах."
    hy: "Երբ ռազմավարական բազմակի հնարավորությունները (Ռ1) ձևակերպվում են հստակ պատկերային կառուցվածքների (Ռ3) մեջ և մարմնավորում գտնում գործառնական կիրառման դաշտում (Ռ2), դրանք ամրապնդվում են անգիտակցական մակարդակում (Ռ4)՝ ձևավորելով կայուն կազմակերպական և մշակութային դինամիկա։ Առաջարկվող հոգեգոյաբանական մոտեցումը ներկայացվում է որպես բազմաշերտ և երկարաժամկետ ազդեցություն ապահովող կառավարման մոդել, որը հատկապես արդյունավետ է բարդ, փոփոխական և վերափոխում պահանջող կազմակերպական միջավայրերում։"
