description:
  - en: "The monograph is devoted to developing an original theoretical system — psychoontology — which regards the psyche not as a set of measurable functional mechanisms, but as a multilevel organization of the subject's reality, comprising four ontological levels (R1–R4)."
    ru: "Монография посвящена разработке оригинальной теоретической системы — психоонтологии, рассматривающей психику не как совокупность функциональных механизмов, поддающихся измерению, но как многоуровневую организацию реальности субъекта, включающую четыре онтологических уровня (R1–R4)."
    hy: "Մենագրությունը նվիրված է օրիգինալ տեսական համակարգի՝ հոգեգոյաբանության մշակմանը, որը հոգեկանը դիտարկում է ոչ որպես չափելի ֆունկցիոնալ մեխանիզմների ամբողջություն, այլ որպես սուբյեկտի իրականության բազմամակարդակ կազմակերպում, ներառյալ չորս գոյաբանական մակարդակներ (R1–R4)։"
  - en: "In accordance with this model, the principal psychic processes — perception, attention, memory, thinking, imagination, and emotion — are analyzed in sequence. It is shown that each of them simultaneously engages several levels of reality and cannot be adequately described within the framework of only one of them."
    ru: "В соответствии с этой моделью последовательно анализируются основные психические процессы — восприятие, внимание, память, мышление, воображение, эмоции. Показано, что каждый из них одновременно задействует несколько уровней реальности и не может быть адекватно описан в рамках лишь одного из них."
    hy: "Այս մոդելին համապատասխան, հաջորդաբար վերլուծվում են հիմնական հոգեկան գործընթացները՝ ընկալում, ուշադրություն, հիշողություն, մտածողություն, երևակայություն, հույզեր։ Ցույց է տրվում, որ դրանցից յուրաքանչյուրը միաժամանակ ներգրավում է իրականության մի քանի մակարդակներ և չի կարող համարժեքորեն նկարագրվել դրանցից միայն մեկի սահմաններում։"
  - en: "From this theoretical foundation, methodological and diagnostic consequences are derived. A concept of psychoontological testing is proposed, within which specific instruments are developed: a psychoontological questionnaire, a test of symbolic apperception, and an ontological personality profile. Interpretive methodologies are described for application in clinical, counseling, and pedagogical practice."
    ru: "Из этого теоретического основания выводятся методологические и диагностические следствия. Предлагается концепция психоонтологического тестирования, в рамках которой разрабатываются конкретные инструменты: психоонтологический опросник, тест символической апперцепции и онтологический профиль личности. Описаны интерпретационные методологии для применения в клинической, консультативной и педагогической практике."
    hy: "Այս տեսական հիմքից բխում են մեթոդաբանական և ախտորոշիչ հետևանքներ։ Առաջարկվում է հոգեգոյաբանական թեստավորման հայեցակարգ, որի շրջանակներում մշակվում են կոնկրետ գործիքներ՝ հոգեգոյաբանական հարցարան, խորհրդանշական ապերցեպցիայի թեստ և անձի գոյաբանական պրոֆիլ։ Նկարագրված են մեկնաբանական մեթոդաբանություններ՝ կլինիկական, խորհրդատվական և մանկավարժական պրակտիկայում կիրառելու համար։"
