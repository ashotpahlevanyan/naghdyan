description:
  - en: "The monograph is devoted to substantiating the possibility of applying a metaphysical approach to the study of psychic phenomena. The book consists of three parts."
    ru: "Монография посвящена обоснованию возможности применения метафизического подхода к исследованию психических явлений. Книга состоит из трех частей."
    hy: "Մենագրությունը նվիրված է հոգեկան երևույթների ուսումնասիրության մեջ մետաֆիզիկական մոտեցման կիրառման հնարավորության հիմնավորմանը։ Գիրքը բաղկացած է երեք մասից։"
  - en: "The first part presents the philosophical foundations of the metaphysical approach in science, together with an analysis of the particular features of attitudes toward metaphysics in psychology, examined through the prism of the methodological positions of many outstanding psychologists."
    ru: "В первой части представлены философские основания метафизического подхода в науке, а также анализ особенностей отношения к метафизике в психологии, рассматриваемого через призму методологических позиций многих выдающихся психологов."
    hy: "Առաջին մասում ներկայացված են գիտության մեջ մետաֆիզիկական մոտեցման փիլիսոփայական հիմքերը, ինչպես նաև հոգեբանության մեջ մետաֆիզիկայի հանդեպ վերաբերմունքի առանձնահատկությունների վերլուծությունը՝ դիտարկված բազմաթիվ ականավոր հոգեբանների մեթոդաբանական դիրքորոշումների պրիզմայով։"
  - en: "The second part presents applications of the metaphysical approach to analyzing the problem of the adequacy of psychic reflection, the particulars of identifying the “image of the world” with “the world,” and the psychological causes behind the emergence of differing worldview positions among philosophers."
    ru: "Во второй части книги представлены приложения метафизического подхода к анализу проблемы адекватности психического отражения, особенностей отождествления «образа мира» с «миром» и психологических причин возникновения у философов разных мировоззренческих позиций."
    hy: "Գրքի երկրորդ մասում ներկայացված են մետաֆիզիկական մոտեցման կիրառությունները հոգեկան արտացոլման համարժեքության խնդրի, «աշխարհի կերպարը» «աշխարհի» հետ նույնացնելու առանձնահատկությունների և փիլիսոփաների մոտ աշխարհայացքային տարբեր դիրքորոշումների առաջացման հոգեբանական պատճառների վերլուծության համար։"
  - en: "In the third part, using the principle of symmetry as an example, it is shown how the metaphysical conceptions of symmetry held by the ancient Greeks are transformed into general scientific concepts and philosophical categories, which makes it possible to take a fresh look at the manifestations of psychic phenomena and to demonstrate the methodological significance of the principle of symmetry for psychological research and even for creating a concept of education."
    ru: "В третьей части, на примере принципа симметрии, показывается как метафизические представления древних греков о симметрии мира превращаются в общенаучные понятия и философские категории, что позволяет по-новому взглянуть на проявления психических феноменов и показать методологическое значение принципа симметрии для психологических исследований и, даже, для создания концепции обучения."
    hy: "Երրորդ մասում, համաչափության սկզբունքի օրինակով, ցույց է տրվում, թե ինչպես են հին հույների՝ աշխարհի համաչափության մասին մետաֆիզիկական պատկերացումները վերածվում ընդհանուր գիտական հասկացությունների և փիլիսոփայական կատեգորիաների, ինչը թույլ է տալիս նոր տեսանկյունից նայել հոգեկան երևույթների դրսևորումներին և ցույց տալ համաչափության սկզբունքի մեթոդաբանական նշանակությունը հոգեբանական հետազոտությունների, ինչպես նաև ուսուցման հայեցակարգի ստեղծման համար։"
