description:
  - en: "Like any process of development, the development of society likewise has its stable and unstable, transforming, transitional periods. Today we are living precisely within a transforming society, and this process of transformation is reflected in the psychology of each of us. It is precisely the analysis of this influence to which the present work is devoted."
    ru: "Как и любой процесс развития, развитие общества также имеет свои устойчивые и неустойчивые, трансформирующиеся, переходные периоды. Сегодня мы живём именно в трансформирующемся обществе, и этот процесс трансформации отражается на психологии каждого из нас. Именно анализу этого влияния и посвящена настоящая работа."
    hy: "Այնպես, ինչպես զարգացման ցանկացած գործընթաց, հասարակության զարգացումը ևս ունի իր կայուն և անկայուն, փոխակերպվող, անցումային շրջանները։ Այսօր մենք հենց փոխակերպվող հասարակության մեջ ենք ապրում և այդ փոխակերպման գործընթացն անդրադառնում է մեզանից յուրաքանչյուրի հոգեբանության վրա։ Հենց այդ ազդեցության վերլուծությանն է նվիրված այս աշխատությունը։"
