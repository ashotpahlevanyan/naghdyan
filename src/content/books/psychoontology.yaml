description:
  - en: "The book Psychoontology: Toward an Ontology of the Unconscious and Psychoontological Therapy represents the conceptual foundation of a new direction in contemporary psychology — psychoontology. The author proposes an original metaphysical model of psychic reality, based on distinguishing four levels of reality and on the principle of the psychological relativism of reality."
    ru: "Книга «Психоонтология: к онтологии бессознательного и психоонтологической терапии» представляет собой концептуальное основание нового направления в современной психологии — психоонтологии. Автор предлагает оригинальную метафизическую модель психической реальности, основанную на различении четырёх уровней реальности и принципе психологического релятивизма реальности."
    hy: "Գիրքը «Հոգեգոյաբանություն. դեպի անգիտակցականի գոյաբանություն և հոգեգոյաբանական թերապիա» ներկայացնում է ժամանակակից հոգեբանության մեջ նոր ուղղության՝ հոգեգոյաբանության հայեցակարգային հիմքը։ Հեղինակն առաջարկում է հոգեկան իրականության օրիգինալ մետաֆիզիկական մոդել՝ հիմնված իրականության չորս մակարդակների տարբերակման և իրականության հոգեբանական հարաբերականության սկզբունքի վրա։"
  - en: "The central theme of the book is the ontological status of the unconscious, which is regarded not as psychic content repressed from consciousness, but as a deep potential reality identical to the quantum level of being. From this perspective, the psyche is revealed as a mode of presence within reality, rather than as its reflection."
    ru: "Центральной темой книги является онтологический статус бессознательного, которое рассматривается не как психическое содержание, вытесненное из сознания, а как глубинная потенциальная реальность, тождественная квантовому уровню бытия. В этой перспективе психика раскрывается как способ присутствия в реальности, а не как её отражение."
    hy: "Գրքի կենտրոնական թեման անգիտակցականի գոյաբանական կարգավիճակն է, որը դիտարկվում է ոչ որպես գիտակցությունից դուրս մղված հոգեկան բովանդակություն, այլ որպես գոյության քվանտային մակարդակին նույնական խորքային պոտենցիալ իրականություն։ Այս տեսանկյունից հոգեկանը բացահայտվում է ոչ որպես իրականության արտացոլում, այլ որպես դրանում ներկայության եղանակ։"
  - en: "The book develops a methodology of psychoontological analysis that makes it possible to describe psychic phenomena, traumas, inner conflicts, and images through the prism of ontological tensions between levels of reality. On this basis the author formulates the principles of psychoontological therapy — an approach oriented not toward correcting symptoms, but toward restoring the subject's ontological integrity and his connectedness with the deep reality."
    ru: "В книге развёрнута методология психоонтологического анализа, позволяющая описывать психические явления, травмы, внутренние конфликты и образы через призму онтологических напряжений между уровнями реальности. На этой основе автор формулирует принципы психоонтологической терапии — как подхода, ориентированного не на коррекцию симптомов, а на восстановление онтологической целостности субъекта, его сопряжённости с глубинной реальностью."
    hy: "Գրքում մշակված է հոգեգոյաբանական վերլուծության մեթոդաբանություն, որը թույլ է տալիս նկարագրել հոգեկան երևույթները, տրավմաները, ներքին հակասությունները և կերպարները՝ իրականության մակարդակների միջև գոյաբանական լարվածությունների պրիզմայով։ Այս հիմքի վրա հեղինակը ձևակերպում է հոգեգոյաբանական թերապիայի սկզբունքները՝ որպես մոտեցում, որն ուղղված է ոչ թե ախտանիշների շտկմանը, այլ սուբյեկտի գոյաբանական ամբողջականության և խորքային իրականության հետ նրա կապվածության վերականգնմանը։"
