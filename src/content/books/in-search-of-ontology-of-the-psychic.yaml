description:
  - en: "The present monograph is devoted to the synthesis of three fields of knowledge — transcendental psychology, metaphysics, and quantum mechanics. The first chapter draws parallels between the particular features of the reality in which the possibilities for the generation of psychic phenomena are embedded, and the reality of quantum phenomena. The second chapter, through comparative analysis, shows the differences among three contemporary metaphysical conceptions of consciousness — those of the psychologists A. I. Mirakyan and V. M. Allakhverdov, and the physicist M. B. Mensky. The third, drawing on Aristotle's metaphysics, shows the philosophical-methodological unity of transcendental psychology and quantum mechanics. The fourth examines the development of psychology and physics in the context of the positions of the external and internal observer. It is shown that the transition to a non-classical stage of development — that is, to transcendental psychology and quantum mechanics — is conditioned by a shift from the position of the external observer to that of the internal observer."
    ru: "Настоящая монография посвящена синтезу трех областей знания – трансцендентальной психологии, метафизики и квантовой механики. В первой главе проводятся параллели между особенностями реальности, в которой заложены возможности порождения психических феноменов, и реальностью квантовых явлений. Во второй главе в сравнительном анализе показывается различие трех современных метафизических концепций сознания – психологов А.И. Миракяна, В.М. Аллахвердова и физика М.Б. Менского. В третьей - на основе метафизики Аристотеля показывается философско-методологическое единство трансцендентальной психологии и квантовой механики. В четвертой - рассматривается развитие психологии и физики в контексте позиций внешнего и внутреннего наблюдателя. Показывается, что переход к неклассической стадии развития, то есть к трансцендентальной психологии и квантовой механике, обусловлен переходом от позиции внешнего наблюдателя к позиции внутреннего наблюдателя."
    hy: "Սույն մենագրությունը նվիրված է երեք գիտելիքի ոլորտների՝ տրանսցենդենտալ հոգեբանության, մետաֆիզիկայի և քվանտային մեխանիկայի սինթեզին։ Առաջին գլխում զուգահեռներ են անցկացվում այն իրականության առանձնահատկությունների միջև, որում ամրագրված են հոգեկան երևույթների ծնման հնարավորությունները, և քվանտային երևույթների իրականության միջև։ Երկրորդ գլխում, համեմատական վերլուծության միջոցով, ցույց է տրվում գիտակցության երեք ժամանակակից մետաֆիզիկական հայեցակարգերի տարբերությունը՝ հոգեբաններ Ա. Ի. Միրակյանի, Վ. Մ. Ալլախվերդովի և ֆիզիկոս Մ. Բ. Մենսկու։ Երրորդում՝ Արիստոտելի մետաֆիզիկայի հիման վրա ցույց է տրվում տրանսցենդենտալ հոգեբանության և քվանտային մեխանիկայի փիլիսոփայական-մեթոդաբանական միասնությունը։ Չորրորդում քննարկվում է հոգեբանության և ֆիզիկայի զարգացումը արտաքին և ներքին դիտորդի դիրքորոշումների համատեքստում։ Ցույց է տրվում, որ զարգացման ոչ դասական փուլին անցումը, այսինքն՝ տրանսցենդենտալ հոգեբանությանն ու քվանտային մեխանիկային, պայմանավորված է արտաքին դիտորդի դիրքից ներքին դիտորդի դիրքին անցումով։"
