description:
  - en: "The book Psychoontology Beyond Hawking's M-Theory represents a bold attempt to juxtapose the newest cosmological conceptions with the philosophical-psychological doctrine of the nature of the psyche. Whereas Hawking's M-theory strives to explain the structure of the universe through physics alone, psychoontology shows that reality itself — from the quantum level to human consciousness — is inseparable from perception and the deep layers of the psyche."
    ru: "Книга «Психоонтология за пределами М-теории Хокинга» представляет собой смелую попытку сопоставить новейшие космологические концепции и философско-психологическое учение о природе психики. Если М-теория Хокинга стремится объяснить устройство Вселенной лишь через физику, то психоонтология показывает, что сама реальность — от квантового уровня до человеческого сознания — неотделима от восприятия и глубинных слоёв психики."
    hy: "Գիրքը «Հոգեգոյաբանությունը Հոքինգի Մ-տեսության սահմաններից դուրս» ներկայացնում է համարձակ փորձ՝ համադրելու տիեզերաբանության նորագույն հասկացությունները հոգեկանի բնության մասին փիլիսոփայական-հոգեբանական ուսմունքի հետ։ Եթե Հոքինգի Մ-տեսությունը ձգտում է բացատրել Տիեզերքի կառուցվածքը միայն ֆիզիկայի միջոցով, ապա հոգեգոյաբանությունը ցույց է տալիս, որ ինքնին իրականությունը՝ քվանտային մակարդակից մինչև մարդկային գիտակցություն, անբաժանելի է ընկալումից և հոգեկանի խորքային շերտերից։"
  - en: "The book emphasizes that psychoontology is not opposed to physics but expands its horizons. It demonstrates that a genuine understanding of the structure of reality requires taking into account not only the laws of matter but also the laws of psychic being, which manifest themselves in the unconscious, in perception, and in the cultural experience of humanity."
    ru: "Книга подчёркивает, что психоонтология не противопоставляется физике, а расширяет её горизонты. Она демонстрирует, что для подлинного понимания устройства реальности необходимо учитывать не только законы материи, но и законы психического бытия, которые проявляются в бессознательном, восприятии и культурном опыте человечества."
    hy: "Գիրքն ընդգծում է, որ հոգեգոյաբանությունը ոչ թե հակադրվում է ֆիզիկային, այլ ընդլայնում է նրա հորիզոնները։ Այն ցույց է տալիս, որ իրականության կառուցվածքի իսկական ըմբռնման համար անհրաժեշտ է հաշվի առնել ոչ միայն նյութի օրենքները, այլև հոգեկան գոյության օրենքները, որոնք դրսևորվում են անգիտակցականում, ընկալման մեջ և մարդկության մշակութային փորձում։"
  - en: "The first part of the book uncovers the theoretical foundations of psychoontology. In the second part, attention shifts to the practical dimension. Psychoontology becomes the basis for a new therapy, for hypnosis, and for describing psychoontological personality types. The third part offers new interpretations of communication, creativity, education, and science. Through the psychoontological perspective, hidden layers of culture, art, and mathematics are revealed, and the boundaries of artificial consciousness and the possibilities of its control are discussed."
    ru: "В первой части книги раскрываются теоретические основания психоонтологии. Во второй части внимание переносится на практическое измерение. Психоонтология становится основой для новой терапии, гипноза и описания психоонтологических типов личности. В третьей части книги предлагаются новые виды интерпретации общения, творчества, образования и науки. Через психоонтологический взгляд открываются скрытые слои культуры, искусства и математики, обсуждаются границы искусственного сознания и возможности управления."
    hy: "Գրքի առաջին մասում բացահայտվում են հոգեգոյաբանության տեսական հիմքերը։ Երկրորդ մասում ուշադրությունը տեղափոխվում է գործնական չափման վրա։ Հոգեգոյաբանությունը դառնում է նոր թերապիայի, հիպնոսի և հոգեգոյաբանական անձնային տիպերի նկարագրության հիմքը։ Գրքի երրորդ մասում առաջարկվում են հաղորդակցության, ստեղծագործության, կրթության և գիտության մեկնաբանման նոր տեսակներ։ Հոգեգոյաբանական հայացքի միջոցով բացվում են մշակույթի, արվեստի և մաթեմատիկայի թաքնված շերտերը, քննարկվում են արհեստական գիտակցության սահմանները և կառավարման հնարավորությունները։"
  - en: "Concluding the book, the author returns once more to Hawking, showing that fundamental cosmological models cannot be understood apart from their connection to the psyche. Psychoontology emerges as a more universal framework, uniting the human being and the universe within a single continuum."
    ru: "Завершая книгу, автор вновь возвращается к Хокингу, показывая, что фундаментальные космологические модели не могут быть поняты вне связи с психикой. Психоонтология выступает как более универсальная рамка, объединяющая человека и Вселенную в едином континууме."
    hy: "Ավարտելով գիրքը՝ հեղինակը կրկին վերադառնում է Հոքինգին՝ ցույց տալով, որ տիեզերաբանության հիմնարար մոդելները չեն կարող հասկացվել հոգեկանի հետ կապից դուրս։ Հոգեգոյաբանությունը հանդես է գալիս որպես ավելի համընդհանուր շրջանակ, որը միավորում է մարդուն և Տիեզերքը մեկ շարունակույթում։"
