description:
  - en: "The monograph is devoted to a comparatively young field within contemporary psychology — transcendental psychology."
    ru: "Монография посвящена сравнительно молодому направлению в современной психологии – трансцендентальной психологии."
    hy: "Մենագրությունը նվիրված է ժամանակակից հոգեբանության համեմատաբար երիտասարդ ուղղությանը՝ տրանսցենդենտալ հոգեբանությանը։"
  - en: "The first chapter presents the philosophical grounds for the necessity of applying a metaphysical approach to solving the fundamental problems of psychology. The second chapter examines certain methodological approaches of traditional psychology to the study of psychic phenomena in comparison with the metaphysical approach. The third chapter introduces the concept of a transcendental ideal of rationality, supplementing the classification of types of scientific rationality that currently exists in the philosophy of science. It is shown that it is precisely transcendental rationality that makes possible the study of the deep principles underlying the generation of the psychic."
    ru: "В первой главе представлены философские основания необходимости применения метафизического подхода для решения фундаментальных проблем психологии. Во второй главе рассмотрены некоторые методологические подходы традиционной психологии к исследованию психических явлений в сопоставлении с метафизическим подходом. В третьей главе вводится понятие о трансцендентальном идеале рациональности, дополняющем существующую в современной философии науки классификацию типов научной рациональности. Показывается, что именно трансцендентальная рациональность дает возможность исследования глубинных принципов порождения психического."
    hy: "Առաջին գլխում ներկայացված են հոգեբանության հիմնարար խնդիրների լուծման համար մետաֆիզիկական մոտեցման կիրառման անհրաժեշտության փիլիսոփայական հիմքերը։ Երկրորդ գլխում քննարկվում են ավանդական հոգեբանության որոշ մեթոդաբանական մոտեցումներ հոգեկան երևույթների ուսումնասիրության հարցում՝ համեմատած մետաֆիզիկական մոտեցման հետ։ Երրորդ գլխում ներմուծվում է ռացիոնալության տրանսցենդենտալ իդեալի հասկացությունը, որը լրացնում է գիտության ժամանակակից փիլիսոփայության մեջ գոյություն ունեցող գիտական ռացիոնալության տիպերի դասակարգումը։ Ցույց է տրվում, որ հենց տրանսցենդենտալ ռացիոնալությունն է հնարավորություն տալիս ուսումնասիրելու հոգեկանի ծագման խորքային սկզբունքները։"
