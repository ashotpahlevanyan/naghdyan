description:
  - en: "From the standpoint of the principle of symmetry, the book presents a theoretical analysis of the processes of direct sensory reflection, perception, and thinking, showing that mental phenomena, like all other phenomena of nature, possess properties of symmetry and asymmetry. This underscores the idea of the unity of nature and the unity of physical and psychic phenomena. The same analysis reveals that some psychologists, in constructing their theories, drew on considerations and principles of symmetry, although evidently doing so intuitively."
    ru: "В книге, с точки зрения принципа симметрии, проведен теоретический анализ процессов непосредственно-чувственного отражения, восприятия и мышления, который показал, что психическое, как и все остальные явления природы обладают свойствами симметрии и асимметрии. Этим подчеркивается идея единства природы, единства физических и психических явлений. Из этого же анализа видно, что некоторые психологи, при построении своих теорий, пользовались соображениями и принципами симметрии, хотя и делали это, очевидно, интуитивно."
    hy: "Համաչափության սկզբունքի տեսանկյունից գրքում իրականացվել է անմիջական-զգայական արտացոլման, ընկալման և մտածողության գործընթացների տեսական վերլուծություն, որը ցույց է տվել, որ հոգեկանը, ինչպես բնության մյուս բոլոր երևույթները, օժտված է համաչափության և անհամաչափության հատկություններով։ Դրանով ընդգծվում է բնության միասնության, ֆիզիկական և հոգեկան երևույթների միասնության գաղափարը։ Նույն վերլուծությունից երևում է, որ որոշ հոգեբաններ, կառուցելով իրենց տեսությունները, օգտվել են համաչափության սկզբունքներից ու նկատառումներից, թեև, ակնհայտորեն, դա արել են ինտուիտիվ կերպով։"
  - en: "To demonstrate that principles of symmetry can be applied to the study of mental phenomena, the author shows how these principles can be used in experimental research, illustrated by revealing differences in the effectiveness of solving mutually inverse problems of equal logical complexity. The study made it possible to identify a property of thinking — an asymmetry in solving “direct” and “inverse” problems, consisting in the fact that “direct” problems are solved better and faster than “inverse” ones. A description of the psychological mechanisms for solving “direct” and “inverse” problems made it possible to determine their distinction from a psychological point of view (apart from the mathematical, logical, and linguistic ones)."
    ru: "Чтобы доказать возможность применения принципов симметрии при изучении психических явлений, автор показывает как можно использовать эти принципы в экспериментальном исследовании на примере выявления различия в эффективности решения взаимообратных задач, одинаковых по своей логической сложности. Проведенное исследование позволило выявить свойство мышления – асимметрию в решении «прямых» и «обратных» задач, заключающуюся в том, что «прямые» задачи решаются лучше и быстрее, чем «обратные». А описание психологических механизмов решения «прямых» и «обратных» задач позволило определить их различие с психологической точки зрения (кроме математической, логической и лингвистической)."
    hy: "Ապացուցելու համար, որ համաչափության սկզբունքները կիրառելի են հոգեկան երևույթների ուսումնասիրության մեջ, հեղինակը ցույց է տալիս, թե ինչպես կարելի է այդ սկզբունքներն օգտագործել փորձարարական հետազոտության մեջ՝ տրամաբանական բարդությամբ հավասար փոխադարձ-հակադարձ խնդիրների լուծման արդյունավետության տարբերությունը հայտնաբերելու օրինակով։ Իրականացված հետազոտությունը թույլ է տվել բացահայտել մտածողության մի հատկություն՝ «ուղիղ» և «հակադարձ» խնդիրների լուծման անհամաչափությունը, որն արտահայտվում է նրանում, որ «ուղիղ» խնդիրները լուծվում են ավելի լավ և արագ, քան «հակադարձները»։ Իսկ «ուղիղ» և «հակադարձ» խնդիրների լուծման հոգեբանական մեխանիզմների նկարագրությունը թույլ է տվել որոշել դրանց տարբերությունը հոգեբանական տեսանկյունից (բացի մաթեմատիկականից, տրամաբանականից և լեզվաբանականից)։"
