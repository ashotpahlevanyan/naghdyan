description:
  - en: "This work attempts to offer an alternative view of the nature of psychic reflection, one that differs from the traditional approach. It gives a new interpretation of the interaction between the human psyche and surrounding reality, in connection with which it became necessary to introduce the concept of a reality existing prior to reflection, one radically different from what is directly perceived."
    ru: "В данной работе делается попытка дать альтернативный взгляд на природу психического отражения, который отличается от традиционного. Дается новая трактовка взаимодействия психики человека с окружающей действительностью, в связи с чем оказалось необходимым введение понятия реальности, существующей до отражения, кардинально отличающейся от непосредственно воспринимаемой."
    hy: "Այս աշխատանքում փորձ է արվում ներկայացնել հոգեկան արտացոլման բնույթի մասին այլընտրանքային տեսակետ, որը տարբերվում է ավանդական մոտեցումից։ Տրվում է մարդու հոգեկանի և շրջապատող իրականության փոխազդեցության նոր մեկնաբանություն, ինչի կապակցությամբ անհրաժեշտ դարձավ ներմուծել արտացոլումից առաջ գոյություն ունեցող իրականության հասկացությունը, որը արմատապես տարբերվում է անմիջականորեն ընկալվողից։"
  - en: "The work devotes attention to disclosing the content of the mechanisms and principles of psychic reflection. In particular, it examines the processes of projection and identification, which are necessary stages in forming the image of the world that we are conscious of and come to know."
    ru: "В работе уделяется внимание раскрытию содержания механизмов и принципов психического отражения. В частности рассматриваются процессы проецирования и отождествления, являющиеся необходимыми этапами в формировании образа того мира, который мы осознаем и познаем."
    hy: "Աշխատանքում ուշադրություն է դարձվում հոգեկան արտացոլման մեխանիզմների և սկզբունքների բովանդակության բացահայտմանը։ Մասնավորապես դիտարկվում են պրոյեկցիայի և նույնացման գործընթացները, որոնք անհրաժեշտ փուլեր են այն աշխարհի կերպարի ձևավորման մեջ, որը մենք գիտակցում և ճանաչում ենք։"
