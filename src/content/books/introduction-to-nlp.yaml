description:
  - en: "The book offered to the reader answers three questions: 1. Who created NLP and under what historical conditions did it emerge; 2. On what philosophical and methodological foundation could it have arisen; 3. How to apply NLP."
    ru: "Предлагаемая читателю книга отвечает на три вопроса: 1. Кто создавал НЛП и в каких исторических условиях оно появилось; 2. На каком философском и методологическом фундаменте оно могло возникнуть; 3. Как применять НЛП."
    hy: "Ընթերցողին առաջարկվող գիրքը պատասխանում է երեք հարցի. 1. Ով է ստեղծել ՆԼԾ-ն, և ինչ պատմական պայմաններում է այն առաջացել, 2. Ինչ փիլիսոփայական և մեթոդաբանական հիմքի վրա կարող էր այն ծագել, 3. Ինչպես կիրառել ՆԼԾ-ն։"
  - en: "Each of the parts is of independent interest, yet together they form a single whole. Books 1 and 2 contain not only a description of NLP techniques, as in most books on NLP, but also the results of work with seminar participants in the form of demonstrations accompanied by detailed commentary."
    ru: "Каждая из частей представляет самостоятельный интерес, но вместе они составляют единое целое. В книгах 1 и 2 содержится не только описание техник НЛП, как в большинстве книг по НЛП, но также результаты работы с участниками семинаров в виде демонстраций, сопровождаемых подробными комментариями."
    hy: "Յուրաքանչյուր մասն ունի ինքնուրույն հետաքրքրություն, բայց միասին կազմում են մեկ ամբողջություն։ 1-ին և 2-րդ գրքերում ընդգրկված է ոչ միայն ՆԼԾ տեխնիկաների նկարագրություն, ինչպես ՆԼԾ-ի մասին գրքերի մեծ մասում, այլև սեմինարների մասնակիցների հետ աշխատանքի արդյունքները՝ մանրամասն մեկնաբանություններով ուղեկցվող ցուցադրությունների տեսքով։"
