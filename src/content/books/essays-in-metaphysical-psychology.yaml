description:
  - en: "This work attempts to apply a metaphysical approach to investigating the nature of psychic reflection, which differs from the traditional approach. In connection with the interaction between the human psyche and surrounding reality, a new interpretation is offered, from which it follows that it is necessary to introduce the concept of a reality existing prior to reflection, one that is fundamentally different from direct perception. This conception provided the grounds for a classification of the realities in which a person and his consciousness exist."
    ru: "В данной работе делается попытка использовать метафизический подход для исследования природы психического отражения, что отличается от традиционного подхода. В связи со взаимодействием психики человека и окружающей действительности дается новая трактовка, из которой следует, что необходимо ввести понятие реальности, существующей до отражения, что коренным образом отличается от непосредственного восприятия. Это представление послужило причиной для классификации реальностей, в которых существует человек и его сознание."
    hy: "Այս աշխատանքում փորձ է արվում մետաֆիզիկական մոտեցումը օգտագործել հոգեկանի արտացոլման բնույթը ուսումնասիրելու համար, ինչը տարբերվում է ավանդական մոտեցումից։ Մարդու հոգեկանի և շրջակա իրականության փոխգործունեության հետ կապված տրվում է նոր մեկնաբանություն, ինչից պարզվում է, որ անհրաժեշտ է ներմուծել մինչ արտացոլումը գոյություն ունեցող իրականության հասկացությունը, ինչը հիմնովին տարբերվում է անմիջական ընկալումից։ Այդ պատկերացումը պատճառ հանդիսացավ իրականությունների դասակարգման, որոնցում գոյություն ունի մարդը, և իր գիտակցությունը։"
  - en: "On the basis of the principle of the psychological relativity of reality put forward by the author, the psychological causes of the contradictions between materialism and idealism are uncovered."
    ru: "На основе выдвинутого автором принципа психологической относительности реальности раскрываются психологические причины противоречий между материализмом и идеализмом."
    hy: "Հեղինակի կողմից առաջ քաշված իրականության հոգեբանական հարաբերականության սկզբունքի հիմքի վրա բացահայտվում են մատերիալիզմի և իդեալիզմի միջև հակասությունների հոգեբանական պատճառները։"
