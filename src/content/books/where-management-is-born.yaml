description:
  - en: "The book Where Does Management Come From is an interdisciplinary study in which management is examined at the level of the ontological foundations of the psyche and of reality. Unlike classical approaches that emphasize skills and rational decision-making, the work proposes to understand management as a mode of organizing reality that flows from the ontological position of the managing subject."
    ru: "Книга «Откуда рождается управление» представляет собой междисциплинарное исследование, в котором управление рассматривается на уровне онтологических оснований психики и реальности. В отличие от классических подходов, которые делают акцент на навыках и рациональных решениях, работа предлагает понимать управление как способ организации реальности, вытекающий из онтологической позиции управляющего субъекта."
    hy: "«Որտեղից է ծնվում կառավարումը» գիրքը միջառարկայական ուսումնասիրություն է, որտեղ կառավարումը դիտարկվում է հոգեկանի և իրականության գոյաբանական հիմքերի մակարդակում։ Ի տարբերություն դասական մոտեցումների, որոնք շեշտում են հմտությունները և ռացիոնալ որոշումները, աշխատությունն առաջարկում է կառավարումը հասկանալ որպես իրականության կազմակերպման եղանակ, որը բխում է ղեկավար սուբյեկտի գոյաբանական դիրքից։"
