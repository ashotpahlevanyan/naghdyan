description:
  - en: "The book Foundations of Psychoontology: Definitions, Axioms, Theorems, Laws is the first systematic exposition of psychoontology as a new philosophical-scientific discipline, investigating the ontological status of the psyche, the structure of reality, and the principles of modulational transitions between its levels. The work develops a multilevel model of reality (R1–R4), formulates the basic and extended axiomatic systems of psychoontology, and introduces the definitions, axioms, theorems, and laws of psychoontological dynamics."
    ru: "Книга «Основания психоонтологии: определения, аксиомы, теоремы, законы» представляет собой первое систематическое изложение психоонтологии как новой философско-научной дисциплины, исследующей онтологический статус психики, структуру реальности и принципы модуляционных переходов между её уровнями. В работе развивается многоуровневая модель реальности (R1–R4), формулируются базовая и расширенная аксиоматические системы психоонтологии, вводятся определения, аксиомы, теоремы и законы психоонтологической динамики."
    hy: "«Հոգեգոյաբանության հիմունքները. սահմանումներ, աքսիոմներ, թեորեմներ, օրենքներ» գիրքը ներկայացնում է հոգեգոյաբանության՝ որպես նոր փիլիսոփայական-գիտական դիսցիպլինի, առաջին համակարգված շարադրանքը, որն ուսումնասիրում է հոգեկանի գոյաբանական կարգավիճակը, իրականության կառուցվածքը և դրա մակարդակների միջև մոդուլյացիոն անցումների սկզբունքները։ Աշխատանքում մշակվում է իրականության բազմամակարդակ մոդելը (R1–R4), ձևակերպվում են հոգեգոյաբանության հիմնային և ընդլայնված աքսիոմատիկ համակարգերը, ներմուծվում են հոգեգոյաբանական դինամիկայի սահմանումները, աքսիոմները, թեորեմները և օրենքները։"
  - en: "Particular attention is given to the psychoontological principle of complementarity, the 3M model (module, modulator, modulation), the problem of consciousness and the brain, the psychoontological theory of perception, and the problem of qualia. The book proposes a new approach to understanding consciousness, the unconscious, and the phenomenal world as aspects of a single multilevel ontological structure."
    ru: "Особое внимание уделено психоонтологическому принципу дополнительности, модели 3М (модуль, модулятор, модуляция), проблеме сознания и мозга, психоонтологической теории восприятия и проблеме квалиа. В книге предлагается новый подход к пониманию сознания, бессознательного и феноменального мира как аспектов единой многоуровневой онтологической структуры."
    hy: "Առանձնահատուկ ուշադրություն է դարձված հոգեգոյաբանական լրացականության սկզբունքին, 3Մ մոդելին (մոդուլ, մոդուլյատոր, մոդուլյացիա), գիտակցության և ուղեղի խնդրին, ընկալման հոգեգոյաբանական տեսությանը և քվալիայի խնդրին։ Գրքում առաջարկվում է գիտակցության, անգիտակցականի և ֆենոմենալ աշխարհի ըմբռնման նոր մոտեցում՝ որպես միասնական բազմամակարդակ գոյաբանական կառուցվածքի կողմեր։"
  - en: "The book is addressed to philosophers, psychologists, consciousness researchers, and specialists in the cognitive sciences, as well as to all those interested in the fundamental questions of the psyche, of being, and of a new picture of the world. The work opens up the prospect of forming psychoontology as an independent research paradigm."
    ru: "Книга адресована философам, психологам, исследователям сознания, специалистам в области когнитивных наук, а также всем, кто интересуется фундаментальными вопросами психики, бытия и новой картиной мира. Работа открывает перспективу формирования психоонтологии как самостоятельной исследовательской парадигмы."
    hy: "Գիրքը հասցեագրված է փիլիսոփաներին, հոգեբաններին, գիտակցության հետազոտողներին, ճանաչողական գիտությունների ոլորտի մասնագետներին, ինչպես նաև բոլոր նրանց, ովքեր հետաքրքրված են հոգեկանի, կեցության և աշխարհի նոր պատկերի հիմնարար հարցերով։ Աշխատանքը բացում է հոգեգոյաբանության՝ որպես ինքնուրույն հետազոտական պարադիգմի ձևավորման հեռանկարը։"
