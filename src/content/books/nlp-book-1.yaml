description:
  - en: "The book offered to the reader answers three questions: 1. Who created NLP, and under what historical conditions did it emerge; 2. On what philosophical foundation could it have arisen; 3. How to apply NLP."
    ru: "Предлагаемая читателю книга отвечает на три вопроса: 1. Кто создавал НЛП, и в каких исторических условиях оно появилось; 2. На каком философском фундаменте оно могло возникнуть; 3. Как применять НЛП."
    hy: "Ընթերցողին առաջարկվող գիրքը պատասխանում է երեք հարցի. 1. Ով է ստեղծել ՆԼԾ-ն, և ինչ պատմական պայմաններում է այն առաջացել, 2. Ինչ փիլիսոփայական հիմքի վրա կարող էր այն ծագել, 3. Ինչպես կիրառել ՆԼԾ-ն։"
  - en: "Each of the parts is of independent interest, yet together they form a single whole. The third part contains not only a description of NLP techniques, as in most books on NLP, but also the results of work with seminar participants in the form of demonstrations accompanied by detailed commentary."
    ru: "Каждая из частей представляет самостоятельный интерес, но вместе являют единое целое. В третьей части содержится не только описание техник НЛП, как в большинстве книг по НЛП, но также результаты работы с участниками семинаров в виде демонстраций, сопровождаемых подробными комментариями."
    hy: "Յուրաքանչյուր մասն ունի ինքնուրույն հետաքրքրություն, բայց միասին կազմում են մեկ ամբողջություն։ Երրորդ մասը պարունակում է ոչ միայն ՆԼԾ տեխնիկաների նկարագրություն, ինչպես ՆԼԾ-ի մասին գրքերի մեծ մասում, այլև սեմինարների մասնակիցների հետ աշխատանքի արդյունքները՝ մանրամասն մեկնաբանություններով ուղեկցվող ցուցադրությունների տեսքով։"
  - en: "The book is addressed not only to those beginning to study NLP, but also to psychologists and psychotherapists with years of practical experience, as well as to philosophers, physicians, and all those interested in questions of human perfection and excellence, regardless of their field of activity."
    ru: "Книга адресована не только начинающим изучение НЛП, но и тем психологам и психотерапевтам, которые имеют опыт многолетней практики, а также философам, врачам и всем тем, кого интересуют вопросы человеческого совершенства и превосходства, независимо от сферы деятельности."
    hy: "Գիրքը հասցեագրված է ոչ միայն ՆԼԾ-ն ուսումնասիրել սկսողներին, այլև այն հոգեբաններին և հոգեթերապևտներին, ովքեր ունեն երկարամյա պրակտիկայի փորձ, ինչպես նաև փիլիսոփաներին, բժիշկներին և բոլոր նրանց, ովքեր հետաքրքրված են մարդկային կատարելության և գերազանցության հարցերով, անկախ գործունեության ոլորտից։"
