description:
  - en: "The book discusses the idea of the psychological relativism of reality, which manifests itself in the differences among world-models held by different subjects of reflection, in different positions of the observer — external and internal — as well as in the dependence of perceived reality on states of consciousness. It is shown that the fruitful development of transcendental psychology is possible on condition that philosophical (metaphysical) conceptions and the theoretical-experimental data of quantum mechanics and the philosophy of physics are drawn upon."
    ru: "В книге обсуждается идея психологического релятивизма реальности, который проявляется в различии моделей мира у разных субъектов отражения, в разных позициях наблюдателя – внешнего и внутреннего, а также в зависимости воспринятой реальности от состояний сознания. Показывается, что плодотворное развитие трансцендентальной психологии возможно при условии привлечения философских (метафизических) концепций, теоретико-экспериментальных данных квантовой механики и философии физики."
    hy: "Գրքում քննարկվում է իրականության հոգեբանական հարաբերականության գաղափարը, որը դրսևորվում է արտացոլման տարբեր սուբյեկտների մոտ աշխարհի մոդելների տարբերության մեջ, դիտորդի տարբեր դիրքերում՝ արտաքին և ներքին, ինչպես նաև ընկալված իրականության՝ գիտակցության վիճակներից կախվածության մեջ։ Ցույց է տրվում, որ տրանսցենդենտալ հոգեբանության արդյունավետ զարգացումը հնարավոր է փիլիսոփայական (մետաֆիզիկական) հասկացությունների, ինչպես նաև քվանտային մեխանիկայի և ֆիզիկայի փիլիսոփայության տեսական-փորձարարական տվյալների ներգրավմամբ։"
