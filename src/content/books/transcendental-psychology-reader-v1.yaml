description:
  - en: "The reader on transcendental psychology offered to readers' attention is intended for a more in-depth study of this comparatively young and, at the same time, fascinating yet complex branch of psychological science. The reader consists of two volumes. The first volume consists of three chapters. The first chapter of this volume gathers transcripts of the seminars of A. I. Mirakyan, the founder of transcendental psychology, in which the methodological foundations of a new approach to studying psychic phenomena and a new mode of thinking were discussed for the first time. For the second chapter, works discussing the methodological questions of transcendental psychology were selected. The third chapter includes theoretical studies that reveal the necessity of forming a new mode of thinking, which can be spoken of as a new type, or ideal, of scientific rationality."
    ru: "Предлагаемая вниманию читателей хрестоматия по трансцендентальной психологии предназначена для более углубленного изучения этого, сравнительно молодого, и, вместе с тем, интересного, но сложного, раздела психологической науки. Хрестоматия состоит из двух томов. Первый том состоит из трех глав. В первой главе этого тома собраны стенограммы семинаров основателя трансцендентальной психологии А.И. Миракяна, на которых впервые обсуждались методологические основы нового подхода к изучению психических явлений и нового образа мышления. Для второй главы были отобраны работы, в которых обсуждаются методологические вопросы трансцендентальной психологии. В третью главу включены теоретические исследования, в которых раскрывается необходимость формирования нового образа мышления, о котором можно говорить, как о новом типе или идеале научной рациональности."
    hy: "Ընթերցողների ուշադրությանն առաջարկվող տրանսցենդենտալ հոգեբանության ընթերցարանը նախատեսված է հոգեբանական գիտության այս համեմատաբար երիտասարդ, և միևնույն ժամանակ հետաքրքիր, բայց բարդ բաժնի առավել խորը ուսումնասիրության համար։ Ընթերցարանը բաղկացած է երկու հատորից։ Առաջին հատորը բաղկացած է երեք գլուխներից։ Այս հատորի առաջին գլխում հավաքված են տրանսցենդենտալ հոգեբանության հիմնադիր Ա. Ի. Միրակյանի սեմինարների սղագրությունները, որտեղ առաջին անգամ քննարկվել են հոգեկան երևույթների ուսումնասիրության նոր մոտեցման և նոր մտածելակերպի մեթոդաբանական հիմքերը։ Երկրորդ գլխի համար ընտրվել են աշխատություններ, որտեղ քննարկվում են տրանսցենդենտալ հոգեբանության մեթոդաբանական հարցերը։ Երրորդ գլխում ընդգրկված են տեսական հետազոտություններ, որոնցում բացահայտվում է նոր մտածելակերպի ձևավորման անհրաժեշտությունը, որի մասին կարելի է խոսել որպես գիտական ռացիոնալության նոր տիպի կամ իդեալի։"
