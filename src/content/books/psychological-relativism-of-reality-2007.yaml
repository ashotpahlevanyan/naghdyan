description:
  - en: "Drawing on A. I. Mirakyan's transcendental psychology of perception, the book shows that the perception of surrounding reality is relative and depends on the structural-processual organization of a person's reflective systems. This means that a person does not, in fact, perceive reality as it truly is. The book also uncovers the essence of the processes of projection and identification, which form the basis of the mechanism of psychic reflection."
    ru: "На основе трансцендентальной психологии восприятия А. И. Миракяна показывается, что восприятие окружающей действительности является относительным и зависит от структурно-процессуальной организации отражательных систем человека. Это означает, что человек на самом деле не воспринимает реальность такой, какая она есть на самом деле. В книге раскрываются также сущность процессов проецирования и отождествления, составляющие основу механизма психического отражения."
    hy: "Ա. Ի. Միրակյանի ընկալման տրանսցենդենտալ հոգեբանության հիման վրա ցույց է տրվում, որ շրջապատող իրականության ընկալումը հարաբերական է և կախված է մարդու արտացոլող համակարգերի կառուցվածքային-գործընթացային կազմակերպումից։ Սա նշանակում է, որ մարդն իրականում չի ընկալում իրականությունը այնպիսին, ինչպիսին այն կա իրականում։ Գրքում բացահայտվում է նաև պրոյեկցիայի և նույնացման գործընթացների էությունը, որոնք կազմում են հոգեկան արտացոլման մեխանիզմի հիմքը։"
