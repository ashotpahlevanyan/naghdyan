description:
  - en: "In the third volume of the reader on transcendental psychology offered to the reader, the presentation continues of transcripts of the seminars of A. I. Mirakyan, the founder of transcendental psychology, in which the methodological questions of a new approach to studying psychic phenomena and a new mode of thinking were first discussed. The main focus of this volume, however, is on those theoretical studies that lay down the philosophical-psychological premises for forming a new mode of thinking in psychology, defined by the author as transcendental rationality, supplementing the classification of types of scientific rationality known in contemporary philosophy of science. This part of the book includes articles by well-known philosophers and psychologists, past and present, demonstrating manifestations of transcendental rationality in fields of knowledge adjacent to philosophy and psychology."
    ru: "В предлагаемом читателю третьем томе хрестоматии по трансцендентальной психологии продолжено представление стенограмм семинаров основателя трансцендентальной психологии А.И. Миракяна, на которых впервые обсуждались методологические вопросы нового подхода к изучению психических явлений и нового образа мышления. Основное же внимание в данном томе уделено тем теоретическим исследованиям, в которых заложены философско-психологические предпосылки формирования нового образа мышления в психологии, определяемого автором как трансцендентальная рациональность, дополняющая известную в современной философии науки классификацию типов научной рациональности. В эту часть книги вошли статьи известных философов и психологов прошлого и современности, демонстрирующие проявления трансцендентальной рациональности в смежных областях знания между философией и психологией."
    hy: "Ընթերցողին առաջարկվող տրանսցենդենտալ հոգեբանության ընթերցարանի երրորդ հատորում շարունակվում է տրանսցենդենտալ հոգեբանության հիմնադիր Ա. Ի. Միրակյանի սեմինարների սղագրությունների ներկայացումը, որտեղ առաջին անգամ քննարկվել են հոգեկան երևույթների ուսումնասիրության նոր մոտեցման և նոր մտածելակերպի մեթոդաբանական հարցերը։ Այս հատորում հիմնական ուշադրությունը դարձված է այն տեսական հետազոտություններին, որոնցում դրված են հոգեբանության մեջ նոր մտածելակերպի ձևավորման փիլիսոփայական-հոգեբանական նախադրյալները, որը հեղինակի կողմից սահմանվում է որպես տրանսցենդենտալ ռացիոնալություն՝ լրացնելով գիտության ժամանակակից փիլիսոփայության մեջ հայտնի գիտական ռացիոնալության տիպերի դասակարգումը։ Գրքի այս մասում ընդգրկված են անցյալի և ժամանակակից հայտնի փիլիսոփաների ու հոգեբանների հոդվածներ, որոնք ցուցադրում են տրանսցենդենտալ ռացիոնալության դրսևորումները փիլիսոփայության և հոգեբանության միջև ընկած հարակից գիտելիքի ոլորտներում։"
