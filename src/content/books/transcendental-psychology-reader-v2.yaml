description:
  - en: "The second volume of the reader offered to the reader is compiled from articles covering the following aspects of transcendental psychology: 1) experimental research into the principles of the generative process of perception, 2) transcendental psychology in the context of traditional psychology, 3) the theoretical and practical potential of transcendental psychology."
    ru: "Предлагаемый читателю второй том хрестоматии составлен из статей, освещающих следующие аспекты трансцендентальной психологии: 1) экспериментальное исследование принципов порождающего процесса восприятия, 2) трансцендентальная психология в контексте традиционной психологии, 3) теоретический и практический потенциал трансцендентальной психологии."
    hy: "Ընթերցողին առաջարկվող ընթերցարանի երկրորդ հատորը կազմված է հոդվածներից, որոնք լուսաբանում են տրանսցենդենտալ հոգեբանության հետևյալ կողմերը. 1) ընկալման ծնող գործընթացի սկզբունքների փորձարարական ուսումնասիրություն, 2) տրանսցենդենտալ հոգեբանությունը ավանդական հոգեբանության համատեքստում, 3) տրանսցենդենտալ հոգեբանության տեսական և գործնական ներուժը։"
